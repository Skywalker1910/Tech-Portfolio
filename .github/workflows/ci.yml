name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - staging/review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      APP_AWS_REGION: us-east-1
      RAG_ENABLED: "false"
      NEXT_PUBLIC_FULL_CHAT_URL: /chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Evaluate local RAG retrieval
        run: npm run rag:evaluate

      - name: Build production application
        run: npm run build
